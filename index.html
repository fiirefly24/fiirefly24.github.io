<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="./assets/birthday-cake.png">
    <style>
      @import url(https://fonts.googleapis.com/css?family=Lato:300italic);

      html,
      body {
        height: 100%;
      }
      body {
        background: #a27bcc;
        background: -moz-radial-gradient(
          center,
          ellipse cover,
          #a27bcc 0%,
          #6c5299 100%
        );
        background: -webkit-gradient(
          radial,
          center center,
          0px,
          center center,
          100%,
          color-stop(0%, #a27bcc),
          color-stop(100%, #6c5299)
        );
        background: -webkit-radial-gradient(
          center,
          ellipse cover,
          #a27bcc 0%,
          #6c5299 100%
        );
        background: -o-radial-gradient(
          center,
          ellipse cover,
          #a27bcc 0%,
          #6c5299 100%
        );
        background: -ms-radial-gradient(
          center,
          ellipse cover,
          #a27bcc 0%,
          #6c5299 100%
        );
        background: radial-gradient(
          ellipse at center,
          #a27bcc 0%,
          #6c5299 100%
        );
        filter: progid:DXImageTransform.Microsoft.gradient(startColorstr='#a27bcc', endColorstr='#6c5299', GradientType=1);
      }
      /* ============================================== POSITION
*/
      .cake {
        position: absolute;
        top: 50%;
        left: 50%;
        margin-left: -50px;
        margin-top: -50px;
        width: 100px;
        height: 100px;
      }
      /* ============================================== BASE
*/
      .cake:after {
        background: #ebe3e1;
        border-radius: 100px;
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100px;
        height: 2px;
      }
      /* ============================================== Candle
*/
      .velas {
        background: #ffffff;
        border-radius: 100%;
        position: absolute;
        top: 50%;
        left: 50%;
        margin-left: -2.5px;
        margin-top: -8.333333333333334px;
        width: 5px;
        height: 16.666666666666668px;
      }
      .velas:after,
      .velas:before {
        background: rgba(255, 0, 0, 0.4);
        content: "";
        position: absolute;
        width: 100%;
        height: 2.2222222222222223px;
      }
      .velas:after {
        top: 25%;
        left: 0;
      }
      .velas:before {
        top: 45%;
        left: 0;
      }
      /* ============================================== Fire
*/
      .fuego {
        border-radius: 100%;
        box-shadow: 0 0 40px 10px rgba(248, 233, 209, 0.2);
        position: absolute;
        top: -12px;
        left: 50%;
        margin-left: -3.3333333333333335px;
        width: 6.666666666666667px;
        height: 12.5px;
      }
      .fuego:nth-child(1) {
        -webkit-animation: fuego 2s infinite;
      }
      .fuego:nth-child(2) {
        -webkit-animation: fuego 1.5s infinite;
      }
      .fuego:nth-child(3) {
        -webkit-animation: fuego 1s infinite;
      }
      .fuego:nth-child(4) {
        -webkit-animation: fuego 0.5s infinite;
      }
      .fuego:nth-child(5) {
        -webkit-animation: fuego 0.2s infinite;
      }
      /* ============================================== Animation Fire
*/
      @-webkit-keyframes fuego {
        0% {
          background: rgba(254, 248, 97, 0.5);
          -webkit-transform: translateY(0) scale(1);
        }
        50% {
          background: rgba(255, 50, 0, 0.1);
          -webkit-transform: translateY(-20px) scale(0);
        }
        100% {
          background: rgba(254, 248, 97, 0.5);
          -webkit-transform: translateY(0) scale(1);
        }
      }
      /* ============================================== Frosting
*/
      .cobertura {
        background: #ece7e3;
        border-radius: 50px;
        position: absolute;
        top: 60%;
        left: 50%;
        margin-left: -27.77777777777778px;
        margin-top: -5px;
        width: 55.55555555555556px;
        height: 12.5px;
        z-index: 10;
      }
      .cobertura:after,
      .cobertura:before {
        background: #ece7e3;
        border-radius: 100px;
        content: "";
        position: absolute;
        width: 5px;
        height: 10px;
      }
      .cobertura:after {
        top: 6.666666666666667px;
        right: 14.285714285714286px;
      }
      .cobertura:before {
        top: 10px;
        right: 9.090909090909092px;
      }
      /* ============================================== BIZCOCHO
*/
      .bizcocho {
        background: #6d3826;
        position: absolute;
        bottom: 0;
        left: 50%;
        margin-left: -25px;
        width: 50px;
        height: 33.333333333333336px;
      }
      .bizcocho:after,
      .bizcocho:before {
        background: rgba(236, 231, 227, 0.6);
        content: "";
        position: absolute;
        width: 100%;
        height: 5px;
      }
      .bizcocho:after {
        top: 30%;
        left: 0;
      }
      .bizcocho:before {
        top: 60%;
        left: 0;
      }
      /* ============================================== TEXT
*/
      h1,
      p {
        font-family: "Lato", sans-serif;
        font-weight: 300;
        font-style: italic;
        text-align: center;
        width: 100%;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        -webkit-user-select: none;
      }
      h1 {
        color: #6c5299;
        font-size: 1em;
        margin-top: 6.8em;
      }
      p {
        color: rgba(236, 231, 227, 0.6);
        font-size: 0.8em;
        line-height: 2em;
      }
    </style>
    <title>Selamat Ulang Tahun!</title>
  </head>
  <body>
    <div>
        <div style="margin-top: 150px;">
          <p style="font-size: 15kljiopx; color: white; font-weight: 400; text-align: center">Semoga kamu bahagia. <br> Semoga sehat selalu. <br> Dimudahkan dalam hidup. <br> Diberkahi Allah SWT. <br> Semoga kamu jadi apa yang kamu inginkan. <br>Harapan-harapan baik buat kamu.</p>
        </div>
        <div>
          <div class="cake">
            <div class="velas">
              <div class="fuego"></div>
              <div class="fuego"></div>
              <div class="fuego"></div>
              <div class="fuego"></div>
              <div class="fuego"></div>
            </div>
            <div class="cobertura"></div>
            <div class="bizcocho"></div>
            <h1>Selamat Ulang Tahun</h1>
            <p>Nur Alfiah</p>
          </div>
          <div class="" style="position: absolute; top: 90%; right: 5%">
            <div class="">
              <p>Credit <a href="https://codepen.io/sonu/pen/AZRvPo" style="text-decoration: none; color: white;">Rajender Joshi</a></p>
            </div>
          </div>
        </div>
    </div>

  </body>
</html>
